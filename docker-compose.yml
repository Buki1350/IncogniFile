services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: sqlite:/app/data/incognifile.db
      PORT: 8080
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      MAIL_DELIVERY: ${MAIL_DELIVERY:-local}
      MAIL_OUTBOX_DIR: /app/data/.mail
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # Intentionally disposable. No database service, password or persistent volume.
    tmpfs:
      - /app/data:rw,noexec,nosuid,size=256m,uid=10001,gid=10001,mode=0700
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
