[package]
name = "incognifile"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.1"
sqlx = { version = "0.8.3", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.137"
argon2 = "0.5.3"
rand = "0.8.5"
sha2 = "0.10.8"
base64 = "0.22.1"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }

[dev-dependencies]
reqwest = { version = "0.12.12", default-features = false, features = ["json", "rustls-tls"] }
